name: E2E tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest-playwright
      - run: playwright install --with-deps chromium
      - run: python -m pytest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/